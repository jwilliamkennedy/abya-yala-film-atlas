name: Film image search
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths: ['tools/thumbs/search_*.csv', 'tools/thumbs/search_candidates.py']
concurrency:
  group: thumbs-search
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pillow
      - name: Search the web for each film and check the share images
        run: |
          for f in tools/thumbs/search_*.csv; do
            n=$(basename "$f" .csv); python3 tools/thumbs/search_candidates.py "$f" "out/$n" &
          done
          wait
      - name: Publish the results to the ci-search branch (not deployed)
        run: |
          cd out
          git init -q -b ci-search
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Film image search ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-search
