name: Thumbnail search (review only)
on:
  push:
    paths:
      - "tools/thumbs/**"
      - ".github/workflows/thumbs-search.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: |
          pip install requests pillow >/dev/null
          mkdir -p out
          python3 tools/thumbs/search.py | tee out/log.txt
      - name: Publish results to ci-shots branch (not deployed)
        if: always()
        run: |
          cd out
          git init -q -b ci-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Thumbnail candidates ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
