name: Thumbnail search (review only)
on:
  push:
    paths:
      - "tools/thumbs/sources2.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: |
          pip install requests pillow >/dev/null
          mkdir -p out
          cp tools/thumbs/pass1/found.jsonl out/found.jsonl; cp -r tools/thumbs/pass1/img out/
          timeout 1500 python3 tools/thumbs/sources2.py | tee out/log.txt || true
      - name: Contact sheets
        if: always()
        run: python3 tools/thumbs/search.py sheets | tee -a out/log.txt
      - name: Publish results to ci-shots branch (not deployed)
        if: always()
        run: |
          cd out
          git init -q -b ci-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Thumbnail candidates ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
