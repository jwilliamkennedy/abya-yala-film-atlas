name: tmp diagnose (Claude)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tmp-diagnose.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 30}
      - run: |
          python3 -m pip install -q 'playwright==1.*'
          python3 -m playwright install --with-deps chromium >/dev/null
          git worktree add -q /tmp/prev 321c202
          python3 -m http.server 8983 --bind 127.0.0.1 >/dev/null 2>&1 &
          (cd /tmp/prev && python3 -m http.server 8984 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          awk "/cat >\/tmp\/check-constellate-discovery.py <<'PY'/{f=1;next} /^ *PY\$/{f=0} f{print}" .github/workflows/constellate-discovery-smoke.yml | sed 's/^          //' > /tmp/ccd.py
          python3 - <<'PATCH'
          s=open('/tmp/ccd.py').read()
          a="""    await p.wait_for_function("document.documentElement.dataset.weaveStage==='build'",timeout=15000)"""
          assert a in s
          b="""    try:
              await p.wait_for_function("document.documentElement.dataset.weaveStage==='build'",timeout=15000)
          except Exception:
              print('DIAG',label,await p.evaluate("JSON.stringify({stage:document.documentElement.dataset.weaveStage,items:window.AtlasCollections.current().items.length,threads:window.AtlasCollections.current().threads.map(t=>[t.name,t.items.length]),cols:window.AtlasCollections.state.collections.map(c=>[c.name,c.items.length]),startHidden:document.querySelector('#weave-start')?.hidden,body:document.body.className,reading:document.querySelector('#constellate-read')?.getAttribute('aria-pressed'),status:document.querySelector('#constellate-status')?.textContent,results:document.querySelector('#ws-theme-results')?.innerText.slice(0,120),hasThemeThread:typeof window.AtlasConstellate.themeThread,published:!!window.AtlasPublished,url:location.href.slice(0,120)})"),'ERRORS',errors,flush=True)
              raise"""
          s=s.replace(a,b.replace('\n          ','\n    ').replace('    try:','    try:',1))
          open('/tmp/ccd.py','w').write(s)
          PATCH
          sed -n 38,46p /tmp/ccd.py
          echo "=== NOW"; python3 /tmp/ccd.py 2>&1 | grep "DIAG\|PASS\|TimeoutError\|AssertionError" | cut -c1-900 || true
          echo "=== PREV"; sed -i 's|http://127.0.0.1:8983/|http://127.0.0.1:8984/|' /tmp/ccd.py; python3 /tmp/ccd.py 2>&1 | grep "DIAG\|PASS\|TimeoutError\|AssertionError" | cut -c1-300 || true
