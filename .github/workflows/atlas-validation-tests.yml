name: Atlas Queue validation regression tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/atlas/check.py'
      - 'tools/atlas/auto_accept.py'
      - 'tools/atlas/schema.py'
      - 'tools/atlas/test_check_validation.py'
      - 'tools/atlas/bake.py'
      - 'tools/atlas/build.py'
      - 'tools/atlas/test_facet_identity.py'
      - 'tools/facets/**'
      - 'beta/index.html'
      - 'beta/corrections.html'
      - 'beta/about.html'
      - 'tools/pages/build.py'
      - 'tools/qa/participation.py'
      - 'beta/data/*.csv'
      - 'data/*.csv'
      - 'tools/thumbs/**/*.csv'
      - 'tools/qa/csv-structure.py'
      - 'tools/atlas/atlasio.py'
      - 'tools/atlas/test_atlasio_split.py'
      - 'tools/atlas/test_bake_page.py'
      - '.github/workflows/atlas-validation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Queue validation regression tests
        run: |
          python3 -m pip install -q openpyxl
          python3 -m unittest discover -s tools/atlas -p 'test_*.py' -v
          python3 tools/qa/csv-structure.py
      - name: Test participation request flow without sending real submissions
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8985 --bind 127.0.0.1 >/tmp/participation.log 2>&1 &
          sleep 2
          python3 tools/qa/participation.py
