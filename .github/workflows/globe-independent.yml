name: Globe terrain and discovery
on:
  push:
    branches: [main]
    paths:
      - 'beta/assets/globe.js'
      - 'beta/assets/globe-experiment.css'
      - 'beta/assets/catalogue.js'
      - 'beta/assets/collection-editor.js'
      - 'beta/assets/collection-store.js'
      - 'beta/assets/geo-integrity.js'
      - 'beta/assets/maplibre/**'
      - 'beta/index.html'
      - 'beta/watch.html'
      - 'beta/watch-20261122.js'
      - 'beta/watch-data.js'
      - 'tools/qa/globe-independent.py'
      - 'tools/qa/globe-share.py'
      - 'beta/assets/constellate.js'
      - 'beta/patches-collections.js'
      - 'tools/qa/globe-csv-concordance.py'
      - 'tools/qa/globe-artwork.py'
      - 'beta/data/*.csv'
      - 'beta/atlas-data.js'
      - '.github/workflows/globe-independent.yml'
  workflow_dispatch:
    inputs:
      full_artwork:
        description: Decode every distinct recorded artwork URL (slower; opt-in)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: globe-independent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Independent globe ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [terrain, discovery, input, csv, artwork]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.mode == 'artwork' && 45 || 12 }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install -q 'playwright==1.*'
          python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          ATLAS_ARTWORK_FULL: ${{ inputs.full_artwork && '1' || '0' }}
        run: |
          python3 -m http.server 8985 --bind 127.0.0.1 >/tmp/globe-independent.log 2>&1 &
          sleep 2
          if [ '${{ matrix.mode }}' = csv ]; then python3 tools/qa/globe-csv-concordance.py; elif [ '${{ matrix.mode }}' = artwork ]; then python3 tools/qa/globe-artwork.py; else python3 tools/qa/globe-independent.py ${{ matrix.mode }}; fi
      - name: Open a shared collection in a clean browser
        if: ${{ !cancelled() && matrix.mode == 'discovery' }}
        run: |
          python3 -m http.server 8990 --bind 127.0.0.1 >/tmp/globe-share.log 2>&1 &
          ATLAS_QA_BASE=http://127.0.0.1:8990/beta/ python3 tools/qa/globe-share.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globe-${{ matrix.mode }}-screenshots
          path: shots/globe-independent/
          if-no-files-found: warn
