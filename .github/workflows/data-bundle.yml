name: Data bundle (rebuild and verify)
on:
  push:
    paths:
      - "beta/*-data.js"
      - "beta/index.html"
      - "tools/build_bundle.py"
      - "tools/bundle_check.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-bundle
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild
        run: python3 tools/build_bundle.py
      - name: Verify the bundled page matches the layered page
        run: |
          pip install playwright==1.* >/dev/null && python -m playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          python3 tools/bundle_check.py
      - name: Commit the rebuilt bundle if it changed
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add beta/data-bundle-*.js beta/index-bundled.html
          if git diff --cached --quiet; then echo "bundle already current"; exit 0; fi
          git commit -q -m "Rebuild data bundle (verified identical to layers)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
