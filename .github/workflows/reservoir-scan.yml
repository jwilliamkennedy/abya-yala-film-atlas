name: Atlas thumbnail reservoir — film-specific scan
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/thumbs/reservoir_batch_*.csv'
      - 'tools/thumbs/reservoir_scan.py'
permissions:
  contents: write
concurrency:
  group: atlas-reservoir-scan
  cancel-in-progress: false
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: pip install -q requests beautifulsoup4 pillow
      - name: Scan film-specific pages, collect film still candidates
        run: |
          python3 tools/thumbs/reservoir_scan.py tools/thumbs/reservoir_batch_${{ matrix.shard }}.csv out
      - name: Push results to isolated research branch
        run: |
          cd out
          git init -q -b ci-reservoir-${{ matrix.shard }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add . && git commit -q -m "Reservoir candidates shard ${{ matrix.shard }} ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-reservoir-${{ matrix.shard }}
