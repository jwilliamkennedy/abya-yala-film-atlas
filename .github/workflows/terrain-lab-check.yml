name: Validate isolated terrain laboratory
on:
  push:
    paths:
      - ".github/workflows/terrain-lab-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify only new laboratory files are exercised
        shell: bash
        run: |
          set -euo pipefail
          test -f beta/terrain-lab/index.html
          test -f beta/terrain-lab/lab.js
          test -f beta/terrain-lab/lab.css
          test -f beta/terrain-lab/assets/manifest.json
          node --check beta/terrain-lab/lab.js
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('beta/terrain-lab/assets')
          m=json.loads((p/'manifest.json').read_text())
          assert m['license']=='public domain'
          for x in m['regions'].values():
            target=Path('beta/terrain-lab')/x['file']
            assert target.is_file() and target.stat().st_size>10000
            assert hashlib.sha256(target.read_bytes()).hexdigest()==x['sha256']
          print('NATURAL_EARTH_IMAGE_ASSET_PASS')
          PY
      - name: Run lab in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8767 --bind 127.0.0.1 --directory . >/tmp/terrain-lab-http.log 2>&1 &
          sleep 2
          google-chrome --version
          timeout 110 google-chrome --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=22000 --dump-dom \
            "http://127.0.0.1:8767/beta/terrain-lab/" \
            > /tmp/terrain-lab-dom.html 2>/tmp/terrain-lab-chrome.log
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          text=Path('/tmp/terrain-lab-dom.html').read_text()
          print('TERRAIN_LAB_RENDERED_DOM_BYTES',len(text))
          assert '<title>Terrain Laboratory' in text
          assert 'id="map-left"' in text and 'id="map-right"' in text
          m=re.search(r'<div id="status"[^>]*>(.*?)</div>',text,re.I|re.S)
          status=html.unescape(re.sub('<[^>]+>',' ',m.group(1)).strip()) if m else 'missing status'
          print('TERRAIN_LAB_STATUS',status)
          ready='data-terrain-lab="ready"' in text
          print('TERRAIN_LAB_READY',ready)
          print('WEBGL_CANVASES',len(re.findall(r'<canvas',text)))
          assert 'unavailable:' not in status.lower(), 'Map dependency failed to load'
          assert ready, 'Both live maps must successfully initialize'
          assert len(re.findall(r'<canvas',text))>=2, 'Both maps must render'
          print('TERRAIN_LAB_CHROME_PASS')
          PY
