name: Beta screenshots
on:
  push:
    paths:
      - "tools/shots/jobs.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install playwright==1.* >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - run: |
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2; mkdir -p shots
          python3 tools/shots/shots.py
      - name: Publish to ci-shots branch (not deployed)
        if: always()
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Beta screenshots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
