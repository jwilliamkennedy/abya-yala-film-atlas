name: Beta basemap screenshots
on:
  push:
    paths:
      - ".github/workflows/beta-basemap-check.yml"
      - "beta/basemap-open-*.js"
      - "beta/basemap-open-*.css"
      - "beta/menus-*.js"
      - "beta/menus-*.css"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          pip install playwright==1.* >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Screenshot beta at three zoom levels
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p shots
          cat > shoot.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def run(pg, url, name, wheels):
              await pg.goto(url, wait_until='networkidle', timeout=90000)
              await pg.wait_for_timeout(6000)
              box = await pg.evaluate("(()=>{const r=document.getElementById('atlas').getBoundingClientRect();return [r.x,r.y,r.width,r.height]})()")
              # Guatemala / Central America
              pt = await pg.evaluate("window.Atlas.screenPoint([-90.5,14.6])")
              x, y = box[0] + pt[0], box[1] + pt[1]
              for _ in range(wheels):
                  await pg.mouse.move(x, y); await pg.mouse.wheel(0, -400); await pg.wait_for_timeout(350)
              await pg.wait_for_timeout(7000)
              state = await pg.evaluate("({basemap:document.documentElement.dataset.basemap||null,state:document.documentElement.dataset.basemapState||null,zoom:document.querySelector('[class*=zoom] output, .zoom-level')?.textContent||null})")
              await pg.screenshot(path=f'shots/{name}.png', clip={'x':box[0],'y':box[1],'width':box[2],'height':box[3]})
              return state
          async def main():
              out = {}
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=['--use-angle=swiftshader', '--enable-unsafe-swiftshader'])
                  ctx = await b.new_context(viewport={'width': 1440, 'height': 900}, device_scale_factor=1)
                  pg = await ctx.new_page(); errs = []
                  pg.on('pageerror', lambda e: errs.append(str(e)))
                  base = 'http://127.0.0.1:8768/beta/index.html'
                  out['open_1x'] = await run(pg, base, 'open_1x', 0)
                  out['open_6x'] = await run(pg, base, 'open_6x', 4)
                  out['open_23x'] = await run(pg, base, 'open_23x', 7)
                  # hover a territory at the 6x view, then open Layers at overview
                  await run(pg, base, 'hover_6x', 0)
                  for _ in range(3):
                      await pg.click('#zoom-in'); await pg.wait_for_timeout(900)
                  await pg.wait_for_timeout(5000)
                  box = await pg.evaluate("(()=>{const r=document.getElementById('atlas').getBoundingClientRect();return [r.x,r.y,r.width,r.height]})()")
                  out['hover_shapes'] = 0
                  for ll in ([-100,45],[-104,40],[-97,38],[-90,40],[-84.5,13],[-70,-35],[-60,-25]):
                      pt = await pg.evaluate(f"window.Atlas.screenPoint({ll})")
                      if not (60 < pt[0] < box[2]-60 and 80 < pt[1] < box[3]-60): continue
                      await pg.mouse.move(box[0]+pt[0], box[1]+pt[1]); await pg.wait_for_timeout(300)
                      await pg.mouse.move(box[0]+pt[0]+2, box[1]+pt[1]+1); await pg.wait_for_timeout(1200)
                      n = await pg.evaluate("document.querySelectorAll('#atlas .territory-focus-shape').length")
                      if n: out['hover_shapes'] = n; out['hover_at'] = ll; break
                  await pg.screenshot(path='shots/hover_6x.png', clip={'x':box[0],'y':box[1],'width':box[2],'height':box[3]})
                  await run(pg, base, 'layers_1x', 0)
                  await pg.locator('#atlas').focus(); await pg.keyboard.press('l'); await pg.wait_for_timeout(1500)
                  await pg.screenshot(path='shots/layers_1x.png')
                  out['relief_23x'] = await run(pg, base + '?basemap=relief', 'relief_23x', 7)
                  out['pageerrors'] = errs[:20]
                  await b.close()
              json.dump(out, open('shots/report.json', 'w'), indent=1)
              print(json.dumps(out, indent=1))
          asyncio.run(main())
          PY
          python3 shoot.py
      - uses: actions/upload-artifact@v4
        with:
          name: beta-basemap-shots
          path: shots/
      - name: Publish screenshots to the ci-shots branch (not deployed)
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Beta basemap screenshots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
