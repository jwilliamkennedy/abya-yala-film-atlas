name: "Stage: verify Read to Play after beta promotion"
on:
  push:
    branches: [beta-to-main-20261112]
    paths:
      - '.github/workflows/stage-play-read-20261112.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Chromium Playwright
        run: |
          python3 -m pip install -q 'playwright==1.*'
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Check Read to Play on main-root and beta
        run: |
          python3 -m http.server 8999 --bind 127.0.0.1 >/tmp/atlas-play-check.log 2>&1 &
          sleep 2
          cat >/tmp/check-read-play.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          async def run():
            async with async_playwright() as p:
              b=await p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for path,width,height in [('',1440,900),('beta/',390,844)]:
                ctx=await b.new_context(viewport={'width':width,'height':height},reduced_motion='reduce')
                pg=await ctx.new_page()
                errors=[]
                pg.on('pageerror',lambda e:errors.append(str(e)))
                await pg.goto('http://127.0.0.1:8999/'+path+'index.html?constellate=1',wait_until='domcontentloaded',timeout=90000)
                await pg.wait_for_function('window.AtlasConstellate?.enabled && window.AtlasCollections?.current()',timeout=55000)
                await pg.evaluate("() => window.AtlasConstellate.themeThread('Land Defense')")
                await pg.wait_for_function('window.AtlasCollections.current().items.length>=6',timeout=20000)
                await pg.evaluate('() => window.AtlasConstellate.setRead(true)')
                await pg.locator('.weave-read-focus').wait_for(state='visible',timeout=15000)
                before=await pg.evaluate("""() => ({stage:document.documentElement.dataset.weaveStage,read:
                  document.querySelector('#constellate-read')?.getAttribute('aria-pressed'),
                  items:window.AtlasCollections.current().items.length,
                  steps:window.AtlasCollections.current().threads.map(t=>t.items.length)})""")
                await pg.locator('#weave-play').click(force=True,timeout=12000)
                await pg.wait_for_timeout(300)
                after=await pg.evaluate("""() => {
                  const e=document.getElementById('weave-player'),mp=document.querySelector('.map-panel');
                  return {stage:document.documentElement.dataset.weaveStage,playing:window.AtlasConstellate.playing,
                   body:document.body.className,hidden:e.hidden,display:getComputedStyle(e).display,
                   rect:e.getBoundingClientRect().toJSON(),mapDisplay:getComputedStyle(mp).display,
                   mapRect:mp.getBoundingClientRect().toJSON(),
                   progress:document.getElementById('weave-play-progress').textContent,
                   title:document.getElementById('weave-play-title').textContent};
                }""")
                print('READ_PLAY',path or 'main',json.dumps({'before':before,'after':after,'errors':errors}),flush=True)
                assert after['playing'] and not after['hidden'] and after['display']!='none' and after['rect']['width']>0,(path,before,after)
                await pg.evaluate('() => window.AtlasConstellate.stopPlay()')
                assert not await pg.evaluate('() => window.AtlasConstellate.playing')
                assert not errors,(path,errors)
                await ctx.close()
              await b.close()
          asyncio.run(run())
          PY
          python3 /tmp/check-read-play.py
