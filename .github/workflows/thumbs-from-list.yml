name: Thumbnails from a filled list (review only)
on:
  push:
    paths:
      - "tools/thumbs/filled/*.csv"
      - "tools/thumbs/filled/rejected.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install requests pillow >/dev/null
          mkdir -p out
          for f in tools/thumbs/filled/*.csv; do CHECKED_ON=$(date -u +%F) python3 tools/thumbs/from_csv.py "$f" "out/$(basename "$f" .csv)"; done
      - name: Publish to ci-thumbs branch (not deployed)
        if: always()
        run: |
          cd out
          git init -q -b ci-thumbs
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Thumbnail review ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-thumbs
