                state['selected']=await page.locator('#tw-detail h3').inner_text()
                state['synopsisLinks']=await page.locator('#tw-detail a[href^="http"]').count()
                await page.locator('#tw-search').fill('memory')
                state['searchNodes']=await page.locator('#tw-graph [data-term]').count()
                assert state['searchNodes']>=1, f'search failed {state}'
                await page.locator('#tw-search').fill('')
                if name=='desktop':
                  await page.locator('#tw-seed').click()
                  await page.wait_for_timeout(2500)
                  state['example']=await page.evaluate("""() => ({
                    threads: window.AtlasCollections.current().threads.length,
                    credits: window.AtlasCollections.current().threads.reduce((n,t)=>n+t.items.length,0),
                    perThread: window.AtlasCollections.current().threads.map(t=>t.items.length),
                    items: window.AtlasCollections.current().items.length,
                    visible: !document.querySelector('#atlas-theme-web').hidden
                  })""")
                  # The UI intentionally seeds three threads with four film
                  # credits each; unique films may be shared across threads.
                  assert state['example']['threads']==3,state
                  assert state['example']['perThread']==[4,4,4],state
                  assert state['example']['credits']==12,state
                  assert 4<=state['example']['items']<=12,state
                  assert not state['example']['visible'],state
                  try:
                    await page.screenshot(path='shots/theme-web-example-desktop.png',full_page=False,timeout=5000,animations='allow')
                  except Exception as ex: print('NONFATAL_SCREENSHOT_ERROR',name,str(ex)[:130])
                else:
                  await page.locator('#tw-mobile-list [data-mobile-network]').click()
                  assert await page.locator('#tw-graph').is_visible(), 'mobile network option not visible'
                  await page.locator('#tw-mobile-list [data-mobile-network]').click()
                  assert await page.locator('#tw-mobile-list [data-mobile-term]').first.is_visible()
                  await page.locator('#tw-close').click()
                  assert await page.locator('#atlas-theme-web').is_hidden()
                # Regression: a thematic link must MOVE to the selected film and
                # clicking Follow must update the open card, not just add silently.
                if await page.locator('#atlas-theme-web').is_hidden():
                  await page.locator('#weave-theme-web-toggle').click()
                if name=='desktop':
                  await page.locator('#tw-graph [data-term]').first.click()
                else:
                  await page.locator('#tw-mobile-list [data-mobile-term]').first.click()
                await page.locator('#tw-detail [data-film-id]').first.wait_for(timeout=12000)
                # Preview is navigation, not authorship. Adding remains explicit.
                snapshot=await page.evaluate("JSON.stringify(window.AtlasCollections.current().items)")
                destination=await page.locator('#tw-detail [data-film-id]').first.get_attribute('data-film-id')
                await page.locator('#tw-detail [data-film-id]').first.click()
                await page.locator('#weave-film-preview').wait_for(state='visible',timeout=12000)
                current=await page.locator('#weave-film-preview h3').inner_text()
                assert current, 'Theme-film selection did not open preview'
                assert await page.evaluate("JSON.stringify(window.AtlasCollections.current().items)")==snapshot, 'Preview added a film'
                state['previewed']=current
                add=page.locator('#weave-film-preview [data-preview-add]')
                if await add.is_enabled():
                  await add.click()
                  assert await page.evaluate("JSON.stringify(window.AtlasCollections.current().items)")!=snapshot, 'Explicit Add did not add film'
                assert not errors, f'Navigation raised page errors: {errors}'
                state['pageerrors']=errors[:12]
                report[name]=state
                await ctx.close()
              await b.close()
            with open('shots/theme-web-qa.json','w') as f:json.dump(report,f,indent=2)
            print('CONSTELLATE_THEME_WEB_QA_OK',json.dumps(report,ensure_ascii=False))
          asyncio.run(run())
          PY
          python3 /tmp/atlas-theme-web-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constellate-theme-web-qa
          path: shots/

  constellate-return:
    name: "Beta: repeated Map and Constellate transitions"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python3 -m pip install -q 'playwright==1.*'
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Verify direct entry, drawing cleanup, theme lens and Map return
        run: |
          python3 -m http.server 8985 --bind 127.0.0.1 >/tmp/atlas-return.log 2>&1 &
          sleep 2
          python3 tools/qa/constellate-return.py

  globe-geography:
    name: "Beta: spherical geometry, source coordinates and CSV joins"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/qa/globe-geography.cjs
