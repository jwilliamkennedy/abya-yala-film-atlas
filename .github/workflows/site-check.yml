          import asyncio,json,os
          from playwright.async_api import async_playwright
          BASE='http://127.0.0.1:8789/beta/index.html?constellate=1&theme-web=1'
          async def click_visible(page,selector):
            # The live map moves continuously; a visible control need not
            # satisfy Playwright's strict "stable" auto-click heuristic.
            # Scroll into view, hit-test its centre, and use a real pointer.
            await page.evaluate("""sel => {
              const el=document.querySelector(sel);
              if(!el)throw Error('Missing control: '+sel);
              el.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'});
            }""",selector)
            await page.wait_for_timeout(140)
            position=await page.evaluate("""sel => {
              const el=document.querySelector(sel),r=el.getBoundingClientRect(),
