                style=getComputedStyle(el);
              return {x,y,width:r.width,height:r.height,hit:hit?.outerHTML.slice(0,180)||'',
                accessible:style.display!=='none'&&style.visibility!=='hidden'&&
                  r.width>1&&r.height>1&&x>=0&&x<innerWidth&&y>=0&&y<innerHeight&&
                  !!hit&&(hit===el||el.contains(hit))};
            }""",selector)
            assert position['accessible'],('Control not pointer-accessible',selector,position)
            await page.mouse.click(position['x'],position['y'])
          async def run():
            report={}
            async with async_playwright() as p:
              b=await p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for name,viewport in [('desktop',{'width':1440,'height':900}),('mobile',{'width':390,'height':844})]:
                ctx=await b.new_context(viewport=viewport,device_scale_factor=1,locale='en-US')
                page=await ctx.new_page()
