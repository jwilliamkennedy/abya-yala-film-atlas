  constellate-discovery:
    name: "Constellate discovery, desktop and phone"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python3 -m pip install -q 'playwright==1.*'
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Check navigation, search, selection, focus and Play
        run: |
          python3 -m http.server 8983 --bind 127.0.0.1 >/tmp/constellate-discovery.log 2>&1 &
          sleep 2
          cat >/tmp/check-constellate-discovery.py <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          ROOT='http://127.0.0.1:8983/'
          async def press(p,selector):
            # The continuously animated map can prevent Playwright's locator
            # stability heuristic from settling. Scroll then hit-test and send
            # a real pointer event to the exposed control.
            await p.evaluate("""selector => {
              const el=document.querySelector(selector);
              if(!el)throw Error('Missing control: '+selector);
              el.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'});
            }""",selector)
            await p.wait_for_timeout(90)
            data=await p.evaluate("""selector => {
              const el=document.querySelector(selector),r=el.getBoundingClientRect(),
                    x=r.left+r.width/2,y=r.top+r.height/2,hit=document.elementFromPoint(x,y),cs=getComputedStyle(el);
              return {x,y,rect:r.toJSON(),hit:hit?.outerHTML.slice(0,180)||'',
                visible:cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>1&&r.height>1&&
                x>=0&&x<innerWidth&&y>=0&&y<innerHeight&&!!hit&&(hit===el||el.contains(hit))};
            }""",selector)
            assert data['visible'],('Control is not pointer-accessible',selector,data)
            await p.mouse.click(data['x'],data['y'])
          async def verify(p,base,label,width,height):
            errors=[]
            p.on('pageerror',lambda err:errors.append(str(err)))
            await p.goto(base+'index.html?constellate=1',wait_until='domcontentloaded',timeout=90000)
            await p.wait_for_function('window.AtlasConstellate?.enabled && document.getElementById("weave-start") && window.AtlasCollections?.current()',timeout=55000)
            beta = label.startswith('beta')
            if beta:
              await p.locator('#weave-map-theme').wait_for(state='visible')
              assert not await p.locator('#weave-start').is_visible()
              assert await p.locator('#weave-map-theme option[value]:not([value=""])').count()==30
              before=await p.evaluate('JSON.stringify(window.AtlasCollections.current())')
              await p.locator('#weave-map-theme').select_option('Cosmology and Origin Stories')
              await p.locator('.weave-map-theme-results').wait_for(state='visible')
              assert await p.evaluate('JSON.stringify(window.AtlasCollections.current())')==before
              await p.locator('#weave-map-theme').select_option('')
              beginning={'themes':30,'collection_unchanged':True}
              # Explicit creation is a separate operation, not an effect of browsing.
              await p.evaluate("window.AtlasConstellate.themeThread('Cosmology and Origin Stories')")
              await p.evaluate("window.AtlasConstellate.open({dock:true}); window.AtlasConstellate.setTab('thread')")
            else:
              beginning=await p.evaluate("""() => {
                const q=document.querySelector('#ws-theme-q'), f=document.querySelector('#ws-film-q'),chips=document.querySelector('.ws-chips'),all=document.querySelector('#ws-theme-all');
                const visible=e=>!!e&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
                return {hasThemeSearch:!!q,themeBeforeChips:!!q&&!!(q.compareDocumentPosition(chips)&Node.DOCUMENT_POSITION_FOLLOWING),
                  themeY:q?.getBoundingClientRect().top, filmY:f.getBoundingClientRect().top,
                  filmVisible:visible(f),allVisible:visible(all),chips:chips?.querySelectorAll('[data-ws-theme]').length||0,terms:[...all.options].filter(o=>o.value).length};
              }""")
              assert beginning['filmVisible'] and beginning['allVisible'] and beginning['chips']>0 and beginning['terms']==30,(label,'missing discovery controls',beginning)
              if label.startswith('main'):
                assert beginning['hasThemeSearch'] and beginning['themeBeforeChips'],(label,'main theme search must be above chips',beginning)
              if label=='main-desktop':
                assert abs(beginning['themeY']-beginning['filmY'])<30,(label,'searches are not parallel',beginning)
              # Open a theme through actual public controls, respecting the simplified beta.
              if beginning['hasThemeSearch']:
                await p.locator('#ws-theme-q').fill('Cosmology and Origin Stories')
                await p.locator('#ws-theme-results [data-ws-theme]').first.click()
              else:
                await p.locator('#ws-theme-all').select_option(value='Cosmology and Origin Stories')
            try:
              await p.wait_for_function("document.documentElement.dataset.weaveStage==='build'",timeout=40000)
            except Exception:
              # Say what the page was doing, so a timeout here explains itself.
              print('DISCOVERY_STAGE_STUCK',label,json.dumps(await p.evaluate("""() => ({stage:document.documentElement.dataset.weaveStage||'',
                films:window.AtlasCollections.current().items.length, threads:window.AtlasCollections.current().threads.map(t=>[t.name,t.items.length]),
                start:getComputedStyle(document.querySelector('#weave-start')).display, results:document.querySelectorAll('#ws-theme-results [data-ws-theme]').length,
                query:document.querySelector('#ws-theme-q')?.value, focus:document.activeElement?.id||document.activeElement?.tagName, body:document.body.className})""")))
              raise
            await p.wait_for_function('window.AtlasCollections.current().items.length>=6',timeout=45000)  # 20 s was not always enough on a runner
            seed=await p.evaluate("""() => {
              const s=window.AtlasCollections.current(),t=s.threads.find(t=>t.id===s.activeThread);
              return {seed:t.items.length,playVisible:getComputedStyle(document.querySelector('#weave-play')).display!=='none',
                thread:t.name};
            }""")
            assert seed['seed']==6 and seed['playVisible'],(label,'six-film starter or top-level Play failed',seed)
            browse='#weave-browse-films' if beta else '#weave-tab-add'
            if beta and not await p.locator(browse).is_visible():
              await press(p,'#constellate-mode .cm-add > summary')
            await press(p,browse)
            await p.wait_for_function("document.querySelector('#weave-editor')?.dataset.tab==='add'",timeout=8000)
            await p.wait_for_function("document.querySelectorAll('#constellate-results .constellate-result').length>=30",timeout=15000)
            search=await p.evaluate("""() => ({
              shown:document.querySelectorAll('#constellate-results .constellate-result').length,
              more:!!document.querySelector('[data-results-more]'),
              status:document.querySelector('#weave-discovery-count')?.textContent,
              focusButton:!!document.querySelector('#weave-focus-thread')
            })""")
            assert search['shown']==48 and search['more'] and search['focusButton'],(label,'first browsing page',search)
            await press(p,'[data-results-more]')
            assert await p.locator('#constellate-results .constellate-result').count()==96,(label,'Show more pagination')
            if beta:
              letter=await p.locator('#constellate-results .weave-az-letter').first.inner_text()
              assert letter,(label,'alphabetic browsing has no groups')
            else:
              letter=await p.evaluate("""() => {
                const b=[...document.querySelectorAll('#weave-az-letters button')].find(x=>!x.disabled&&x.dataset.azLetter!=='A');
                if(!b)return null;
                const value=b.dataset.azLetter;b.click();
                const header=document.querySelector('#constellate-results .weave-az-letter')?.textContent;
                return {value,header,shown:document.querySelectorAll('#constellate-results .constellate-result').length};
              }""")
              assert letter and letter['shown']<=48,(label,'A-Z on-demand navigation',letter)
            await p.locator('#constellate-search').fill('veryunlikelyatlasfilmtermxyz',timeout=12000)
            assert await p.locator('.weave-discovery-empty').count()==1,(label,'no-match recovery')
            await press(p,'[data-discovery-reset]')
            assert await p.locator('#constellate-search').input_value()=='',(label,'search reset')
            if beta:
              await press(p,'#weave-filters > summary')
            await p.locator('#weave-discovery-order').select_option('newest')
            disabled=await p.evaluate("() => [...document.querySelectorAll('#weave-az-letters button')].every(b=>b.disabled)")
            if beta:
              assert await p.locator('#constellate-results .weave-az-letter').count()==0
            else:
              assert disabled,(label,'A-Z jump should be disabled outside alphabetical order')
            await p.locator('#weave-discovery-order').select_option('relevance')
            await press(p,'#weave-discovery-unadded')
            assert await p.locator('#weave-discovery-count').inner_text(),(label,'filtered result count absent')
            await press(p,'#weave-discovery-unadded')
            await press(p,'#weave-discovery-art')
            assert await p.locator('#weave-discovery-count').inner_text(),(label,'image result count absent')
            await press(p,'#weave-discovery-clear')
            await p.locator('#constellate-search').fill('Cosmology')
            await press(p,'[data-az-tab="maker"]')
            assert await p.locator('#constellate-search').input_value()=='Cosmology',(label,'search lost on tab switch')
            await press(p,'[data-az-tab="film"]')
            await press(p,'#weave-discovery-clear')
            await press(p,'#weave-browse-back' if beta else '#weave-tab-thread')
            # A temporary thread focus changes no collection visibility or membership.
            await p.evaluate("""() => window.AtlasCollections.createThread('QA secondary thread','','star-red')""")
            await p.wait_for_function("document.querySelector('#weave-focus-thread')?.hidden===false",timeout=10000)
            before=await p.evaluate("() => window.AtlasCollections.current().threads.map(t=>({id:t.id,visible:t.visible,items:t.items.slice()}))")
            if beta and not await p.locator('.weave-more').evaluate('(e)=>e.open'):
              await press(p,'.weave-more > summary')
            await press(p,'#weave-focus-thread')
            await p.wait_for_function("document.querySelector('#weave-focus-thread')?.getAttribute('aria-pressed')==='true'")
            assert (await p.locator('#weave-focus-thread').text_content()).strip()=='Show all threads',(label,'focus action label')
            focused=await p.evaluate("() => window.AtlasCollections.current().threads.map(t=>({id:t.id,visible:t.visible,items:t.items.slice()}))")
            assert before==focused,(label,'focus mutated saved thread data')
            if beta:
              await p.wait_for_function("!document.querySelector('.weave-more').open")
              await press(p,'.weave-more > summary')
            await press(p,'#weave-focus-thread')
            if beta:
              await p.wait_for_function("!document.querySelector('.weave-more').open")
            await press(p,'#constellate-how>summary')
            help_count=await p.locator('#constellate-how>ol>li').count()
            assert help_count==(3 if beta else 4),(label,'Help steps',help_count)
            await p.keyboard.press('Escape')
            assert not await p.locator('#constellate-how').evaluate('(x)=>x.open'),(label,'Help did not close')
            await press(p,'#weave-play')
            await p.locator('#weave-player:not([hidden])').wait_for(timeout=12000)
            play_state=await p.evaluate("""() => {
              const e=document.querySelector('#weave-play-close'),p=document.querySelector('#weave-player'),r=e.getBoundingClientRect();
              return {button:r.toJSON(),player:p.getBoundingClientRect().toJSON(),
                playerPos:getComputedStyle(p).position,display:getComputedStyle(e).display,innerHeight,
                topAtButton:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.id||''};
            }""")
            print('DISCOVERY_PLAY_STATE',label,json.dumps(play_state,ensure_ascii=False),flush=True)
            b=play_state['button']
            assert play_state['display']!='none' and b['y']>=0 and b['bottom']<=height and play_state['topAtButton']=='weave-play-close',(label,'Play Close is unreachable',play_state)
            await p.mouse.click(b['x']+b['width']/2,b['y']+b['height']/2)
            await p.wait_for_function("!document.body.classList.contains('weave-playing')",timeout=8000)
            await press(p,'#weave-theme-web-toggle')
            await p.locator('#atlas-theme-web:not([hidden])').wait_for(timeout=12000)
            bridge_count=await p.locator('#tw-graph .tw-bridge').count()
            assert bridge_count<=28,(label,'theme network overview too dense',bridge_count)
            await p.locator('#tw-search').fill('Knowledge')
            matching=await p.locator('#tw-graph .tw-node').count()
            assert 1<=matching<=30,(label,'theme family search',matching)
            await p.locator('#tw-search').fill('nonnativethemexyz123')
            assert 'No themes found' in await p.locator('#tw-detail').inner_text(),(label,'no theme match state')
            await press(p,'[data-tw-reset]')
            assert await p.locator('#tw-search').input_value()=='',(label,'reset theme search')
            assert not errors,(label,'JS page exceptions',errors[:7])
            return {'label':label,'beginning':beginning,'seed':seed,'browser':search,'az':letter,'bridges':bridge_count,'family_matches':matching}
          async def main():
            result=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for base,label,width,height in [(ROOT,'beta-build-on-main',390,844),(ROOT+'beta/','beta-mobile',390,844)]:
                ctx=await browser.new_context(viewport={'width':width,'height':height},reduced_motion='reduce')
                page=await ctx.new_page()
                result.append(await verify(page,base,label,width,height))
                await ctx.close()
              await browser.close()
            print('CONSTELLATE_DISCOVERY_PASS',json.dumps(result,ensure_ascii=False))
          asyncio.run(main())
