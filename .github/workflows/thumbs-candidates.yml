name: Film image candidates
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths: ['tools/thumbs/missing_*.csv', 'tools/thumbs/candidates.py']
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pillow
      - name: Find images on each film's credit page
        run: |
          for f in tools/thumbs/missing_*.csv; do
            n=$(basename "$f" .csv); python3 tools/thumbs/candidates.py "$f" "out/$n"
          done
      - name: Publish the results to the ci-thumbs branch (not deployed)
        run: |
          cd out
          git init -q -b ci-thumbs
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Film image candidates ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-thumbs
