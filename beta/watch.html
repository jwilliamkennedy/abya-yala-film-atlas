<style>
/* Watch (22 Nov 2026): a player at the top with its caption under it and, on wide screens, the films nearest to it
   beside it (Related films); then shelves you scroll sideways (Browse) or every film in one index (A–Z).
   Colours and type are the atlas's own tokens (assets/ui-20261109.css, assets/rail-20261121.css): stone greys, one ink,
   the land's gold for what is selected. */
:root{--ink:var(--ui-ink,#14181c);--muted:var(--ui-muted,#5a646d);--accent:var(--ui-ink,#14181c);--line:var(--ui-line,#e2e4e7);
 --bg:var(--ui-paper,#f4f5f6);--card:var(--ui-surface,#fbfcfc);--wash:var(--ui-wash,#e9ebed);--gold:var(--atlas-select,#ad884e);
 --serif:var(--ui-serif,Georgia,serif);--sans:var(--ui-sans,system-ui,sans-serif);--tile:232px;--gap:14px;--pad:clamp(16px,3.2vw,44px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font:400 16px/1.55 var(--sans)}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}a:hover,a:focus-visible{border-color:var(--ink)}
button{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:20px var(--pad);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:400 26px/1.1 var(--serif);color:var(--ink);border:0}
.brand small{display:block;font:500 11px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav.primary{display:flex;flex-wrap:wrap;gap:4px 20px}nav.primary a{color:var(--ink);border:0;font-size:15px;padding:6px 0}
.more-menu{position:relative}.more-menu summary{list-style:none;cursor:pointer;font-size:15px;color:var(--muted);padding:6px 0}.more-menu summary::-webkit-details-marker{display:none}
.more-menu summary::after{content:' ▾';font-size:11px}
.more-menu>div{position:absolute;right:0;top:100%;z-index:5;min-width:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px 0;display:flex;flex-direction:column}
.more-menu>div a{color:var(--ink);border:0;padding:7px 14px;font-size:14px}

main.w{max-width:1440px;margin:0 auto;padding:28px 0 64px}
.w-head{padding:0 var(--pad);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 24px}
h1{font:400 clamp(30px,3.6vw,42px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:15px;margin:0}

/* the player */
#now{display:grid;grid-template-columns:minmax(0,1fr);gap:14px 26px;padding:18px var(--pad) 22px}
.frame{position:relative;aspect-ratio:16/9;background:#0d1013;border-radius:8px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.now-cap{display:flex;flex-direction:column;gap:8px;min-width:0}
.now-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
#now-title{font:400 clamp(22px,2.1vw,28px)/1.2 var(--serif);margin:0;text-wrap:balance}
#now-by{flex:1 1 280px;min-width:0}
#now .by{font-size:14px;color:var(--muted);margin:0}
#now .by a{color:var(--ink)}#now-out{white-space:nowrap}
.now-acts{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.now-acts .btn{padding:0 13px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover,.btn:focus-visible{border-color:var(--ink)}
a.btn{border-bottom:1px solid var(--line)}
/* Related films: beside the player and exactly as tall as the player and its caption; only whole rows show */
#queue{display:none}
@media (min-width:1000px){
 #now{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);grid-template-areas:"frame queue" "cap queue"}
 #now .frame{grid-area:frame}#now .now-cap{grid-area:cap}
 #queue:not([hidden]){display:block;grid-area:queue;position:relative;min-height:0}
}
#queue-h{font:500 13px/20px var(--sans);color:var(--muted);margin:0}
/* the script shows as many rows as fit (64px or taller) and the rows share the height, so the last one ends with the caption */
#queue-list{position:absolute;inset:30px 0 0;display:grid;grid-auto-rows:64px;gap:12px;overflow:hidden;list-style:none;margin:0;padding:0}
#queue-list li{min-height:0}
.q-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;width:100%;height:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;border-radius:6px}
.q-pic{position:relative;display:block;height:100%;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:var(--wash);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
.q-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.q-pic img.on{opacity:1}
.q-pic .tile{padding:0}
.q-text{display:block;min-width:0}
.q-text .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:400 15px/1.28 var(--serif);color:var(--ink)}
.q-text .t small{font:12.5px var(--sans);color:var(--muted);margin-left:6px}
.q-text .by{display:block;font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item:hover .t,.q-item:focus-visible .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.q-item:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* the bar: Browse | A–Z, search and themes; in A–Z also the order, Plays here and the letter strip */
.tools{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tools-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px var(--pad)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--wash)}
.seg button{min-height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,28,.12)}
#q{flex:1 1 220px;min-width:0;height:38px;font:inherit;font-size:15px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tools select{font:inherit;font-size:14px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.check{font-size:14px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
#pick:empty{display:none}
.tools[data-view=browse] #sort,.tools[data-view=browse] .check,.tools[data-view=browse] .count,.jump:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--ink);color:var(--card);font-size:13px;border:0;cursor:pointer}
.chip span{font-size:15px;line-height:1;opacity:.8}
.jump{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 var(--pad) 10px;scroll-padding:0 var(--pad)}
.jump::-webkit-scrollbar{display:none}
.jump:not(.az){-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.jump a,.jump button{flex:none;border:0;background:none;color:var(--muted);font-size:13.5px;line-height:30px;padding:0 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.jump a:hover,.jump button:hover{color:var(--ink);background:var(--wash)}
.jump .sep{flex:none;width:1px;margin:7px 6px;background:var(--line)}
.jump.az button{min-width:30px;padding:0;font:500 14px/30px var(--sans);text-align:center}
.jump.az button:disabled{opacity:.28;cursor:default;background:none}
.jump [aria-current=true]{color:var(--ink);background:var(--wash)}

/* shelves */
.shelf{padding:22px 0 4px;scroll-margin-top:calc(var(--stick,110px) + 8px)}
.shelf-head{display:flex;align-items:baseline;gap:12px;padding:0 var(--pad);margin:0 0 10px}
.shelf h2{font:400 21px/1.2 var(--serif);margin:0}
.shelf-head .n{font-size:13px;color:var(--muted)}
.shelf-head .all{margin-left:auto;font-size:13.5px;color:var(--muted);border:0;background:none;cursor:pointer;padding:4px 0}
.shelf-head .all:hover{color:var(--ink)}
/* countries: one row of names in place of a shelf each */
.places{padding:34px var(--pad) 0}.places h2{font:400 21px/1.2 var(--serif);margin:0 0 12px}
.places ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.places button{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.places button:hover,.places button:focus-visible{border-color:var(--ink)}.places small{font-size:12px;color:var(--muted)}
.track-wrap{position:relative}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:var(--tile);gap:var(--gap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;
 scroll-padding:0 var(--pad);padding:4px var(--pad) 12px;scrollbar-width:none;list-style:none;margin:0}
.track::-webkit-scrollbar{display:none}
.track>li{scroll-snap-align:start;min-width:0}
.nudge{position:absolute;top:4px;bottom:12px;width:calc(var(--pad) + 10px);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;
 color:var(--ink);font-size:22px;opacity:0;transition:opacity .15s;z-index:2}
.nudge.l{left:0;background:linear-gradient(90deg,var(--bg) 40%,transparent)}.nudge.r{right:0;background:linear-gradient(270deg,var(--bg) 40%,transparent)}
.track-wrap:hover .nudge:not([hidden]),.nudge:focus-visible{opacity:1}
@media (hover:none){.nudge{display:none}}

/* a film card */
.card{position:relative}
.card .pic{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--wash);border:0;padding:0;cursor:pointer;
 box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent);transition:transform .18s ease,box-shadow .18s ease}
.card .pic:hover,.card .pic:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent),0 10px 24px -12px rgba(20,24,28,.45)}
.card .pic:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.card img.on{opacity:1}
.tile{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;text-align:left;color:var(--ink);
 background:linear-gradient(160deg,var(--card),var(--wash))}
.tile svg{position:absolute;left:50%;top:50%;width:34%;height:auto;transform:translate(-50%,-62%);color:color-mix(in srgb,var(--ink) 13%,transparent)}
.tile i{position:relative;font:normal 500 12px/1.35 var(--sans);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .badge{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 8px;border-radius:999px;
 background:rgba(13,16,19,.72);color:#fff;font:500 11.5px/1 var(--sans);opacity:0;transform:translateY(3px);transition:opacity .15s,transform .15s}
.card .pic:hover .badge,.card .pic:focus-visible .badge,.card.now .badge{opacity:1;transform:none}
.card.now .pic{box-shadow:0 0 0 2px var(--gold)}
.card .save{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(13,16,19,.62);color:#fff;font-size:15px;line-height:28px;
 text-align:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:1;padding:0}
.card:hover .save,.card .save:focus-visible,.card .save[aria-pressed=true]{opacity:1}
.card .save[aria-pressed=true]{background:var(--gold);color:#14181c}
@media (hover:none){.card .save{opacity:.9}.card .badge{opacity:1;transform:none}}
.card .meta{padding:8px 2px 0}
.card .t{font:400 15.5px/1.3 var(--serif);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .t small{font:12.5px var(--sans);color:var(--muted);margin-left:6px}
.card .by{font-size:13px;color:var(--muted);margin:1px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .by a{color:var(--muted);border:0}.card .by a:hover{color:var(--ink)}
.more-tile{height:100%;min-height:130px;display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border:1px dashed var(--line);border-radius:6px;
 background:none;color:var(--muted);font-size:14px;cursor:pointer;width:100%}
.more-tile:hover{color:var(--ink);border-color:var(--ink)}

/* A–Z */
#az{padding:0 var(--pad)}
.az-sec{padding-top:22px;scroll-margin-top:calc(var(--stick,110px) + 8px)}
.az-sec h2{display:flex;align-items:baseline;gap:10px;font:400 26px/1 var(--serif);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.az-sec h2 small{font:13px var(--sans);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:20px var(--gap);list-style:none;margin:0;padding:0}
.empty{color:var(--muted);font-size:15px;padding:40px var(--pad)}
.credit{color:var(--muted);font-size:14px;margin:40px 0 0;padding:0 var(--pad)}

@media (max-width:760px){:root{--tile:168px;--gap:10px}.card .t{font-size:14.5px}.shelf h2{font-size:19px}.tools select{flex:1 1 40%}#q{flex-basis:100%}
 .tools{top:var(--tools-top,0px)}}
html[data-reading-theme="night"] .card .pic{box-shadow:0 0 0 1px rgba(255,255,255,.06)}
html[data-reading-theme="night"] main.w .card,html[data-reading-theme="night"] main.w .track>li,html[data-reading-theme="night"] main.w .shelf-head .all,html[data-reading-theme="night"] main.w .q-item{background:transparent!important;border:0!important;box-shadow:none}
@media (prefers-reduced-motion:reduce){.card .pic,.card img,.q-pic img,.nudge,.card .badge{transition:none}}
</style><script defer src="assets/counter.js"></script>
