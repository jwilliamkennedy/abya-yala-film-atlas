<style>
:root{--ink:#182028;--muted:#55616b;--accent:#9c3b26;--line:rgba(24,32,40,.15);--bg:#eef0ec;--card:#e4e8e2;--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#efe6d2;--muted:#a9b3c8;--accent:#e9d9ad;--line:rgba(233,217,173,.22);--bg:#0e1729;--card:#15213a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font:400 16px/1.6 var(--sans)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}a:hover,a:focus-visible{border-color:var(--accent)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:400 26px/1.1 var(--serif);color:var(--ink);border:0}.brand img{width:30px;height:30px}
.brand small{display:block;font:500 11px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav.primary{display:flex;flex-wrap:wrap;gap:4px 20px}nav.primary a{color:var(--ink);border:0;font-size:15px;padding:6px 0}nav.primary a[aria-current]{box-shadow:inset 0 -2px 0 var(--accent)}
main{max-width:900px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font:400 clamp(30px,4vw,44px)/1.1 var(--serif);margin:8px 0 12px}.lede{font-size:18px;margin:0 0 6px}.note{color:var(--muted);font-size:14px;margin:0 0 22px}

#now .label button{font:inherit;font-size:12px;letter-spacing:.06em;text-transform:none;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#now h2{font:400 24px/1.25 var(--serif);margin:12px 0 2px}#now .by{font-size:14px;color:var(--muted)}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
#q{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{font:inherit;font-size:14px;min-height:34px;padding:0 13px;border:0;background:transparent;color:var(--ink);cursor:pointer}

h2{font:400 22px/1.2 var(--serif);margin:30px 0 4px}h2 small{font:13px var(--sans);color:var(--muted)}.blurb{color:var(--muted);font-size:14px;margin:0 0 8px}
ol{list-style:none;margin:0;padding:0}li{padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}li .t{font:400 19px/1.3 var(--serif);color:var(--ink);border:0}li .t:hover{color:var(--accent)}

.slot .frame{margin-top:10px}.scr{margin:6px 0 0 8px;font:inherit;font-size:13px;min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}.scr[aria-pressed=true]{background:var(--ink);color:var(--bg)}.credit,.empty{color:var(--muted);font-size:14px;margin-top:32px}

/* 2026-11-08: one look with the atlas — ink for anything inside the atlas, accent + ↗ for pages elsewhere */
a.in{color:var(--ink);border-bottom:1px solid var(--line)}a.in:hover{color:var(--accent)}
a.out{color:var(--accent);border-bottom:1px solid currentColor;font-size:13px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:6px}.acts .play,.acts .scr{margin:0}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.check{font-size:14px;color:var(--ink);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
nav.primary{align-items:center}
.more-menu{position:relative}.more-menu summary{list-style:none;cursor:pointer;font-size:15px;color:var(--muted);padding:6px 0}.more-menu summary::-webkit-details-marker{display:none}
.more-menu summary::after{content:' ▾';font-size:11px}
.more-menu>div{position:absolute;right:0;top:100%;z-index:5;min-width:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px 0;display:flex;flex-direction:column}
.more-menu>div a{color:var(--ink);border:0;padding:7px 14px;font-size:14px}.more-menu>div a:hover{color:var(--accent)}
.more-menu .more-group{font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px}
#now .by a.out{font-size:14px}

/* 8 Nov · Watch: one player, one list */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}.tags span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
h1{margin:0 0 6px}.lede{font-size:17px;color:var(--muted);margin:0 0 18px}
#now{background:none;border:0;padding:0;margin:0 0 22px}
#now .frame{border-radius:6px}
.now-cap{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:12px}
#now h2{font:400 24px/1.25 var(--serif);margin:0 0 2px}#now .by{font-size:14px;color:var(--muted);margin:0}#now .note{font-size:13px;color:var(--muted);margin:4px 0 0}#now .note:empty{display:none}
#next{flex:none;font:inherit;font-size:14px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
#next:hover{border-color:var(--ink)}
.tools{gap:10px 12px}
.tools select{font:inherit;font-size:14px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);max-width:100%}
#q{height:38px}
#list{margin-top:4px}
#list>li{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:start;padding:12px 0}
#list>li.now{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:6px}
.pl{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 0 0 2px;margin-top:2px}
.pl:hover,li.now .pl{background:var(--ink);color:var(--bg)}
.pl.off{border-style:dashed;border-color:var(--line);color:var(--muted);cursor:default;font-size:15px;padding:0}
.ft{font:400 19px/1.3 var(--serif);color:var(--ink);margin:0}.ft small{font:13px var(--sans);color:var(--muted);margin-left:8px}
.fb{font-size:14px;color:var(--muted);margin:2px 0 0}
.fl{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:13px}
.fl a,.fl button{font-size:13px}
.fl .scr{margin:0;min-height:26px;padding:0 10px}
.ttag{color:var(--muted)}
@media (max-width:560px){.now-cap{flex-direction:column;gap:8px}#list>li{grid-template-columns:40px 1fr;gap:4px 10px}.tools select{flex:1 1 45%}}
