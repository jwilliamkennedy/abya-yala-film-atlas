name: Review ChatGPT test pages
on:
  push:
    paths:
      - ".github/workflows/beta-testpages-review.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          pip install playwright==1.* >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Screenshot each test page
        run: |
          python3 -m http.server 8770 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p shots/testpages
          cat > shoot.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          PAGES = ['globe-lab', 'basemap-compare', 'option-b-summer', 'terrain-lab', 'terrain-territories-test']
          async def main():
              report = {}
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=['--use-angle=swiftshader', '--enable-unsafe-swiftshader'])
                  for name in PAGES:
                      ctx = await b.new_context(viewport={'width': 1440, 'height': 900})
                      pg = await ctx.new_page(); errs = []; bad = []
                      pg.on('pageerror', lambda e: errs.append(str(e)[:200]))
                      pg.on('console', lambda m: errs.append('console: ' + m.text[:200]) if m.type == 'error' else None)
                      pg.on('response', lambda r: bad.append(f'{r.status} {r.url[:120]}') if r.status >= 400 else None)
                      try:
                          await pg.goto(f'http://127.0.0.1:8770/beta/{name}/', wait_until='load', timeout=90000)
                          await pg.wait_for_timeout(14000)
                          await pg.screenshot(path=f'shots/testpages/{name}_load.png', timeout=150000)
                          await pg.mouse.move(560, 470)
                          for _ in range(4):
                              await pg.mouse.wheel(0, -400); await pg.wait_for_timeout(450)
                          await pg.wait_for_timeout(9000)
                          await pg.screenshot(path=f'shots/testpages/{name}_zoom.png', timeout=150000)
                      except Exception as e:
                          errs.append('RUNNER: ' + str(e)[:200])
                      report[name] = {'errors': errs[:12], 'http_errors': bad[:12], 'n_errors': len(errs), 'n_http_errors': len(bad)}
                      await ctx.close()
                  await b.close()
              json.dump(report, open('shots/testpages/report.json', 'w'), indent=1)
              print(json.dumps(report, indent=1))
          asyncio.run(main())
          PY
          python3 shoot.py
      - name: Publish to ci-shots branch (not deployed)
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Test page review ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
